<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer à tronçons</title>
<style>
  :root {
    --bg: #F5F4EE;
    --surface: #FBFAF6;
    --ink: #1F1E1B;
    --muted: #75736B;
    --line: #E2DFD4;
    --accent: #C4623F;
    --accent-soft: #F1DDD3;
    --done: #B9B5A8;
    --serif: "Tiempos Headline", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1E1D1A; --surface: #262521; --ink: #EDEBE3; --muted: #9C998F;
      --line: #3A3833; --accent: #D9775A; --accent-soft: #3D2A22; --done: #57544D;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { min-height: 100vh; display: flex; justify-content: center; padding: 56px 20px 80px; }
  main { width: 100%; max-width: 560px; }

  h1 { font-family: var(--serif); font-weight: 400; font-size: 1.6rem; margin: 0 0 40px; letter-spacing: -0.01em; }

  /* Affichage principal */
  .stage { text-align: center; margin-bottom: 36px; }
  .segment-name { font-size: 0.95rem; color: var(--muted); min-height: 1.4em; transition: color .3s; }
  .clock {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(4.5rem, 20vw, 7.5rem); line-height: 1; margin: 12px 0 10px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
    transition: color .4s;
  }
  .clock.flash { color: var(--accent); }
  .total { font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Barre segmentée */
  .track { display: flex; gap: 4px; height: 6px; margin: 28px 0 32px; }
  .track .seg { position: relative; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 6px; }
  .track .seg .fill { position: absolute; inset: 0; width: 0; background: var(--accent); }
  .track .seg.done .fill { width: 100%; background: var(--done); }

  /* Contrôles */
  .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 48px; }
  button {
    font: inherit; font-size: 0.95rem; cursor: pointer; border-radius: 999px;
    padding: 10px 20px; border: 1px solid var(--line); background: transparent; color: var(--ink);
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 120px; }
  button.primary:hover { opacity: .88; }
  button:disabled { opacity: .35; cursor: default; }

  /* Configuration */
  .panel { border-top: 1px solid var(--line); padding-top: 24px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .panel-head h2 { font-family: var(--serif); font-weight: 400; font-size: 1.15rem; margin: 0; }
  .panel-head span { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  ol { list-style: none; margin: 0; padding: 0; }
  li {
    display: grid; grid-template-columns: 28px 1fr 84px 32px; gap: 10px; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  li .idx { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  li.active .idx { color: var(--accent); }
  li.past { opacity: .5; }
  input {
    font: inherit; color: var(--ink); background: transparent; border: 1px solid transparent;
    border-radius: 6px; padding: 6px 8px; width: 100%;
  }
  input:hover:not(:disabled) { border-color: var(--line); }
  input:focus { background: var(--surface); border-color: var(--line); outline: none; }
  input.dur { text-align: right; font-variant-numeric: tabular-nums; }
  input.invalid { border-color: var(--accent); }
  input:disabled { color: var(--muted); }
  .remove { padding: 0; width: 28px; height: 28px; border: none; color: var(--muted); font-size: 1.1rem; line-height: 1; }
  .remove:hover { color: var(--accent); }
  .add { margin-top: 14px; border-style: dashed; color: var(--muted); }
  .hint { font-size: 0.8rem; color: var(--muted); margin-top: 20px; line-height: 1.5; }

  /* Journal des checkpoints */
  .log { margin-top: 32px; }
  .log h2 { font-family: var(--serif); font-weight: 400; font-size: 1.15rem; margin: 0 0 8px; }
  .log p { margin: 0; padding: 6px 0; font-size: 0.9rem; display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
  .log p strong { font-weight: 500; color: var(--ink); }

  @media (prefers-reduced-motion: reduce) { .clock { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Timer à tronçons</h1>

  <section class="stage" aria-live="polite">
    <div class="segment-name" id="segName">Prêt</div>
    <div class="clock" id="clock">0:00</div>
    <div class="total" id="totalInfo"></div>
  </section>

  <div class="track" id="track"></div>

  <div class="controls">
    <button class="primary" id="startBtn">Démarrer</button>
    <button id="skipBtn" disabled>Tronçon suivant</button>
    <button id="resetBtn">Réinitialiser</button>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2>Tronçons</h2>
      <span id="sumInfo"></span>
    </div>
    <ol id="list"></ol>
    <button class="add" id="addBtn">Ajouter un tronçon</button>
    <p class="hint">Durée au format 1:30, 90 ou 1m30. Espace pour démarrer ou mettre en pause.</p>
  </section>

  <section class="log" id="log" hidden>
    <h2>Checkpoints</h2>
    <div id="logList"></div>
  </section>
</main>

<script>
(() => {
  // --- État ---
  let segments = [
    { name: "Tronçon 1", dur: 90 },
    { name: "Tronçon 2", dur: 240 },
    { name: "Tronçon 3", dur: 120 },
  ];
  let status = "idle";     // idle | running | paused | finished
  let current = 0;         // index du tronçon en cours
  let segStart = 0;        // timestamp de début du tronçon (ajusté après pause)
  let pausedElapsed = 0;   // ms écoulées dans le tronçon au moment de la pause
  let runStart = 0;        // timestamp de début global
  let totalPaused = 0, pauseAt = 0;
  let checkpoints = [];
  let raf = null;

  const $ = id => document.getElementById(id);
  const clockEl = $("clock"), segNameEl = $("segName"), totalEl = $("totalInfo");
  const trackEl = $("track"), listEl = $("list"), sumEl = $("sumInfo");
  const startBtn = $("startBtn"), skipBtn = $("skipBtn"), resetBtn = $("resetBtn");

  // --- Utilitaires ---
  const fmt = s => {
    s = Math.max(0, Math.ceil(s));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
             : `${m}:${String(sec).padStart(2,"0")}`;
  };
  const parse = str => {
    str = str.trim().toLowerCase().replace(/\s+/g, "");
    if (!str) return null;
    let m;
    if ((m = str.match(/^(\d+):(\d{1,2}):(\d{1,2})$/))) return +m[1]*3600 + +m[2]*60 + +m[3];
    if ((m = str.match(/^(\d+):(\d{1,2})$/))) return +m[1]*60 + +m[2];
    if ((m = str.match(/^(?:(\d+)h)?(?:(\d+)m(?:in)?)?(\d+)?s?$/)) && (m[1]||m[2]||m[3]))
      return (+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0);
    return null;
  };
  const totalDur = () => segments.reduce((a, s) => a + s.dur, 0);
  const now = () => performance.now();

  // --- Rendu de la liste ---
  function renderList() {
    listEl.innerHTML = "";
    const locked = status === "running" || status === "paused";
    segments.forEach((s, i) => {
      const li = document.createElement("li");
      if (locked && i === current) li.className = "active";
      if ((locked && i < current) || status === "finished") li.classList.add("past");

      const idx = document.createElement("span");
      idx.className = "idx"; idx.textContent = i + 1;

      const name = document.createElement("input");
      name.value = s.name; name.setAttribute("aria-label", `Nom du tronçon ${i+1}`);
      name.addEventListener("input", () => { s.name = name.value; if (i === current) renderStage(); });

      const dur = document.createElement("input");
      dur.className = "dur"; dur.value = fmt(s.dur); dur.inputMode = "numeric";
      dur.setAttribute("aria-label", `Durée du tronçon ${i+1}`);
      dur.disabled = locked && i <= current;
      dur.addEventListener("input", () => {
        const v = parse(dur.value);
        dur.classList.toggle("invalid", !v);
        if (v) { s.dur = v; renderTrack(); renderStage(); renderSum(); }
      });
      dur.addEventListener("blur", () => { dur.value = fmt(s.dur); dur.classList.remove("invalid"); });
      dur.addEventListener("keydown", e => { if (e.key === "Enter") dur.blur(); });

      const rm = document.createElement("button");
      rm.className = "remove"; rm.textContent = "×";
      rm.setAttribute("aria-label", `Supprimer le tronçon ${i+1}`);
      rm.disabled = segments.length <= 1 || (locked && i <= current);
      rm.addEventListener("click", () => { segments.splice(i, 1); renderAll(); });

      li.append(idx, name, dur, rm);
      listEl.append(li);
    });
    $("addBtn").disabled = false;
  }

  function renderSum() {
    sumEl.textContent = `${segments.length} tronçon${segments.length > 1 ? "s" : ""}, ${fmt(totalDur())} au total`;
  }

  function renderTrack() {
    trackEl.innerHTML = "";
    const total = totalDur();
    segments.forEach((s, i) => {
      const d = document.createElement("div");
      d.className = "seg"; d.style.flex = s.dur / total;
      if (i < current || status === "finished") d.classList.add("done");
      const f = document.createElement("div"); f.className = "fill";
      d.append(f); trackEl.append(d);
    });
  }

  // --- Temps écoulé ---
  const segElapsed = () =>
    status === "running" ? (now() - segStart) / 1000 :
    status === "paused" ? pausedElapsed / 1000 : 0;

  function renderStage() {
    const seg = segments[current];
    if (status === "idle") {
      segNameEl.textContent = segments[0] ? `${segments[0].name || "Tronçon 1"} · 1 sur ${segments.length}` : "Prêt";
      clockEl.textContent = fmt(segments[0]?.dur || 0);
      totalEl.textContent = `Total ${fmt(totalDur())}`;
    } else if (status === "finished") {
      segNameEl.textContent = "Terminé";
      clockEl.textContent = "0:00";
      totalEl.textContent = `Durée réelle ${fmt(checkpoints.at(-1)?.at || 0)}`;
    } else {
      const el = segElapsed();
      const remaining = seg.dur - el;
      const doneBefore = segments.slice(0, current).reduce((a, s) => a + s.dur, 0);
      segNameEl.textContent = `${seg.name || "Tronçon " + (current+1)} · ${current+1} sur ${segments.length}`
        + (status === "paused" ? " · en pause" : "");
      clockEl.textContent = fmt(remaining);
      totalEl.textContent = `Reste au total ${fmt(totalDur() - doneBefore - el)}`;
      const fill = trackEl.children[current]?.firstChild;
      if (fill) fill.style.width = Math.min(100, (el / seg.dur) * 100) + "%";
      document.title = `${fmt(remaining)} · ${seg.name || "Tronçon " + (current+1)}`;
    }
    if (status === "idle" || status === "finished") document.title = "Timer à tronçons";
  }

  function renderControls() {
    startBtn.textContent = status === "running" ? "Pause" : status === "paused" ? "Reprendre" : status === "finished" ? "Recommencer" : "Démarrer";
    skipBtn.disabled = !(status === "running" || status === "paused");
  }

  function renderLog() {
    const log = $("log"), list = $("logList");
    log.hidden = checkpoints.length === 0;
    list.innerHTML = "";
    checkpoints.forEach(c => {
      const p = document.createElement("p");
      p.innerHTML = `<strong></strong><span></span>`;
      p.firstChild.textContent = c.label;
      p.lastChild.textContent = fmt(c.at);
      list.append(p);
    });
  }

  function renderAll() {
    if (current >= segments.length) current = segments.length - 1;
    renderList(); renderSum(); renderTrack(); renderStage(); renderControls(); renderLog();
  }

  // --- Boucle ---
  function tick() {
    if (status !== "running") return;
    const seg = segments[current];
    const el = (now() - segStart) / 1000;
    if (el >= seg.dur) {
      const overshoot = (el - seg.dur) * 1000;
      passCheckpoint(overshoot);
      if (status !== "running") return;
    }
    renderStage();
    raf = requestAnimationFrame(tick);
  }

  function elapsedTotal() { return (now() - runStart - totalPaused) / 1000; }

  function passCheckpoint(overshootMs = 0) {
    const isLast = current === segments.length - 1;
    checkpoints.push({
      label: isLast ? "Fin" : `Checkpoint ${current + 1}`,
      at: elapsedTotal() - overshootMs / 1000,
    });
    flash();
    if (isLast) {
      status = "finished";
      cancelAnimationFrame(raf);
    } else {
      current++;
      segStart = now() - overshootMs;
      pausedElapsed = 0;
    }
    renderList(); renderTrack(); renderControls(); renderLog(); renderStage();
  }

  function flash() {
    clockEl.classList.add("flash");
    setTimeout(() => clockEl.classList.remove("flash"), 900);
  }

  // --- Actions ---
  function start() {
    if (status === "finished") reset();
    if (status === "idle") {
      current = 0; checkpoints = []; totalPaused = 0;
      runStart = segStart = now();
    } else if (status === "paused") {
      segStart = now() - pausedElapsed;
      totalPaused += now() - pauseAt;
    }
    status = "running";
    renderAll();
    raf = requestAnimationFrame(tick);
  }
  function pause() {
    pausedElapsed = now() - segStart;
    pauseAt = now();
    status = "paused";
    cancelAnimationFrame(raf);
    renderAll();
  }
  function reset() {
    cancelAnimationFrame(raf);
    status = "idle"; current = 0; checkpoints = []; pausedElapsed = 0;
    renderAll();
  }
  function skip() {
    if (status === "paused") { totalPaused += now() - pauseAt; pauseAt = now(); }
    const wasPaused = status === "paused";
    status = "running";
    passCheckpoint(0);
    if (wasPaused && status === "running") { status = "paused"; pauseAt = now(); pausedElapsed = 0; renderAll(); }
    else if (status === "running") raf = requestAnimationFrame(tick);
  }

  startBtn.addEventListener("click", () => status === "running" ? pause() : start());
  resetBtn.addEventListener("click", reset);
  skipBtn.addEventListener("click", skip);
  $("addBtn").addEventListener("click", () => {
    segments.push({ name: `Tronçon ${segments.length + 1}`, dur: 60 });
    renderAll();
    listEl.lastChild?.querySelector(".dur")?.focus();
  });
  document.addEventListener("keydown", e => {
    if (e.code === "Space" && e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON") {
      e.preventDefault();
      status === "running" ? pause() : start();
    }
  });

  renderAll();
})();
</script>
</body>
</html>
